<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ask questions about your data in plain English and get verified SQL, tables and charts." />
    <meta name="theme-color" content="#0b1020" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>NL2SQL-X · Talk to your data</title>
    <script>
      try {
        const t = localStorage.getItem("nl2sql.theme");
        if (t === "light" || (!t && matchMedia("(prefers-color-scheme: light)").matches)) {
          document.documentElement.classList.remove("dark");
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
