[project]
name = "nl2sql-x"
version = "3.0.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "ASYNC", "RUF"]
ignore = ["S101", "S311", "S608", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"backend/app/prompts.py" = ["E501"]
"backend/tests/*" = ["S", "E501"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
