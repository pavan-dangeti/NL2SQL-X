services:
  - type: web
    name: nl2sql-x
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health/ready
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: CORS_ORIGINS
        sync: false
      - key: TRUSTED_PROXY_HOPS
        value: "2"
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
